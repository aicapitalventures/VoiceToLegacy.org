name: Verify Founding Authors Release

on:
  push:
    branches:
      - feature/03-founding-authors-and-cover-fix
    paths:
      - scripts/verify_founding_authors_release.py
      - .github/workflows/verify-founding-authors-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/03-founding-authors-and-cover-fix
          fetch-depth: 0

      - name: Run repository and functionality verification
        run: python scripts/verify_founding_authors_release.py

      - name: Remove one-time verification machinery
        run: |
          rm -f scripts/verify_founding_authors_release.py
          rm -f .github/workflows/verify-founding-authors-release.yml
          rmdir scripts 2>/dev/null || true

      - name: Commit verification record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verification changes to commit."
            exit 0
          fi
          git commit -m "test: verify Founding Authors release readiness"
          git push origin HEAD:feature/03-founding-authors-and-cover-fix
