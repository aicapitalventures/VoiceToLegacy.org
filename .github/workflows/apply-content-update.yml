name: Apply Voice to Legacy Content Update

on:
  push:
    branches:
      - content/02-advisor-identity-boys-to-men-proof
    paths:
      - scripts/apply_advisor_identity_and_boys_to_men.py
      - .github/workflows/apply-content-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: content/02-advisor-identity-boys-to-men-proof
          fetch-depth: 0

      - name: Apply controlled content update
        run: python scripts/apply_advisor_identity_and_boys_to_men.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "content: adopt advisor identity and feature Boys to Men"
          git push origin HEAD:content/02-advisor-identity-boys-to-men-proof
