name: Apply Founding Authors Section

on:
  push:
    branches:
      - feature/03-founding-authors-and-cover-fix
    paths:
      - .asset-chunks/**
      - scripts/apply_founding_authors.py
      - .github/workflows/apply-founding-authors.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/03-founding-authors-and-cover-fix
          fetch-depth: 0

      - name: Apply controlled Founding Authors update
        run: python scripts/apply_founding_authors.py

      - name: Verify required images and references
        run: |
          test -s assets/img/founding-authors-banner.webp
          test -s assets/img/boys-to-men-front-web.webp
          test -s assets/img/boys-to-men-back-web.webp
          grep -q 'founding-authors-banner.webp' published-work/index.html
          grep -q 'boys-to-men-front-web.webp' published-work/index.html
          grep -q 'boys-to-men-back-web.webp' published-work/index.html
          grep -q 'The Founding Authors™' published-work/index.html
          grep -q 'Nine inaugural distinctions remain' published-work/index.html
          ! grep -q 'boys-to-men-front.webp' published-work/index.html
          ! grep -q 'boys-to-men-back.webp' published-work/index.html

      - name: Remove one-time build machinery
        run: |
          rm -rf .asset-chunks
          rm -f scripts/apply_founding_authors.py
          rm -f .github/workflows/apply-founding-authors.yml
          rmdir scripts 2>/dev/null || true

      - name: Commit completed site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feature: add Founding Authors inaugural ten and repair book covers"
          git push origin HEAD:feature/03-founding-authors-and-cover-fix
